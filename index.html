<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>یادداشت‌های روان‌شناسی</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <p class="site-title"><a href="/">یادداشت‌های روان‌شناسی</a></p>
    <p class="site-tagline">نوشته‌هایی درباره‌ی روان‌شناسی و خلاصه‌ی کتاب‌هایی که خوانده‌ام</p>
  </div>
</header>

<main class="wrap">
  <ul class="post-list" id="post-list">
    <li class="empty-state">در حال بارگذاری...</li>
  </ul>
</main>

<footer class="site-footer">
  <div class="wrap">© <span id="year"></span></div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function formatDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch { return ''; }
}

async function loadPosts() {
  const list = document.getElementById('post-list');
  try {
    const res = await fetch('/api/public/pages');
    const data = await res.json();
    const pages = data.pages || [];

    if (pages.length === 0) {
      list.innerHTML = '<li class="empty-state">هنوز نوشته‌ای منتشر نشده است.</li>';
      return;
    }

    list.innerHTML = pages.map(p => `
      <li class="post-item">
        <h2><a href="/page.html?slug=${encodeURIComponent(p.slug)}">${esc(p.title)}</a></h2>
        ${p.excerpt ? `<p class="post-excerpt">${esc(p.excerpt)}</p>` : ''}
        <span class="post-date">${formatDate(p.updated_at)}</span>
      </li>
    `).join('');
  } catch (e) {
    list.innerHTML = '<li class="empty-state">خطا در بارگذاری نوشته‌ها.</li>';
  }
}

loadPosts();
</script>
</body>
</html>
