<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-topbar">
  <div class="wrap-wide" style="display:flex; align-items:center; justify-content:space-between; width:100%;">
    <span class="brand"><a href="dashboard.html">پنل مدیریت</a></span>
    <div style="display:flex; gap:10px;">
      <a href="/" target="_blank"><button class="btn-ghost">مشاهده سایت</button></a>
      <button class="btn-ghost" id="logout-btn">خروج</button>
    </div>
  </div>
</div>

<div class="wrap-wide">
  <div class="dash-header">
    <h2>صفحه‌ها</h2>
    <button class="btn-primary" id="new-page-btn">+ صفحه‌ی جدید</button>
  </div>

  <div id="pages-list">
    <p class="empty-note">در حال بارگذاری...</p>
  </div>
</div>

<script>
function formatDate(iso) {
  try { return new Date(iso).toLocaleDateString('fa-IR', { year: 'numeric', month: 'short', day: 'numeric' }); }
  catch { return ''; }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

async function checkAuth() {
  const res = await fetch('/api/session');
  const data = await res.json();
  if (!data.authenticated) location.href = 'index.html';
}

async function loadPages() {
  const container = document.getElementById('pages-list');
  const res = await fetch('/api/pages');
  if (res.status === 401) { location.href = 'index.html'; return; }
  const data = await res.json();
  const pages = data.pages || [];

  if (pages.length === 0) {
    container.innerHTML = '<p class="empty-note">هنوز صفحه‌ای نساخته‌ای. با دکمه‌ی «صفحه‌ی جدید» شروع کن.</p>';
    return;
  }

  container.innerHTML = pages.map(p => `
    <div class="page-row" data-id="${p.id}">
      <div class="info">
        <h3>
          <a href="editor.html?id=${p.id}">${esc(p.title)}</a>
          <span class="status-badge ${p.status === 'published' ? 'status-published' : 'status-draft'}">
            ${p.status === 'published' ? 'منتشر شده' : 'پیش‌نویس'}
          </span>
        </h3>
        <div class="meta">/${esc(p.slug)} · بروزرسانی ${formatDate(p.updated_at)}</div>
      </div>
      <div class="actions">
        <a href="editor.html?id=${p.id}"><button class="btn-secondary">ویرایش</button></a>
        <button class="btn-danger" onclick="deletePage(${p.id}, this)">حذف</button>
      </div>
    </div>
  `).join('');
}

async function deletePage(id, btn) {
  if (!confirm('این صفحه برای همیشه حذف شود؟')) return;
  btn.disabled = true;
  await fetch(`/api/pages/${id}`, { method: 'DELETE' });
  loadPages();
}

document.getElementById('new-page-btn').addEventListener('click', async () => {
  const res = await fetch('/api/pages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: 'صفحه بدون عنوان' }),
  });
  const data = await res.json();
  if (res.ok) location.href = `editor.html?id=${data.id}`;
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = 'index.html';
});

checkAuth();
loadPages();
</script>
</body>
</html>
