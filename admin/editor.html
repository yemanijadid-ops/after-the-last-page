<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ویرایش صفحه</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
</head>
<body>

<div class="admin-topbar">
  <div class="wrap-wide" style="display:flex; align-items:center; justify-content:space-between; width:100%;">
    <span class="brand"><a href="dashboard.html">پنل مدیریت</a></span>
    <a href="dashboard.html"><button class="btn-ghost">← بازگشت به فهرست</button></a>
  </div>
</div>

<div class="wrap">
  <div class="editor-meta">
    <div class="editor-meta-row">
      <div class="field">
        <label for="title-input">عنوان صفحه</label>
        <input type="text" id="title-input">
      </div>
      <div class="field">
        <label for="status-input">وضعیت</label>
        <select id="status-input">
          <option value="draft">پیش‌نویس</option>
          <option value="published">منتشر شده</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="slug-input">آدرس صفحه (slug)</label>
      <input type="text" id="slug-input" dir="ltr" style="text-align:left;">
    </div>
  </div>

  <div class="editor-toolbar">
    <button class="btn-secondary" data-add="heading">+ تیتر</button>
    <button class="btn-secondary" data-add="paragraph">+ متن</button>
    <button class="btn-secondary" data-add="quote">+ نقل‌قول کتاب</button>
    <button class="btn-secondary" data-add="image">+ تصویر</button>
    <button class="btn-secondary" data-add="divider">+ جداکننده</button>
  </div>

  <div id="blocks-container"></div>

  <div class="save-bar">
    <button class="btn-primary" id="save-btn">ذخیره</button>
    <a id="preview-link" href="#" target="_blank"><button class="btn-ghost" type="button">مشاهده صفحه</button></a>
    <span class="save-status" id="save-status"></span>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const pageId = params.get('id');
let blocks = [];
let currentSlug = '';

const BLOCK_LABELS = {
  heading: 'تیتر', paragraph: 'متن', quote: 'نقل‌قول کتاب', image: 'تصویر', divider: 'جداکننده'
};

function uid() { return Math.random().toString(36).slice(2, 10); }

function defaultContent(type) {
  if (type === 'heading') return { text: 'تیتر تازه', level: 2 };
  if (type === 'paragraph') return { text: '' };
  if (type === 'quote') return { text: '', source: '' };
  if (type === 'image') return { url: '', caption: '' };
  return {};
}

function fieldsHtml(block) {
  const c = block.content;
  switch (block.type) {
    case 'heading':
      return `
        <select data-field="level">
          <option value="2" ${c.level === 2 ? 'selected' : ''}>تیتر بزرگ</option>
          <option value="3" ${c.level === 3 ? 'selected' : ''}>تیتر کوچک</option>
        </select>
        <div style="margin-top:8px;">
          <input type="text" data-field="text" value="${escAttr(c.text)}">
        </div>`;
    case 'paragraph':
      return `<textarea data-field="text" rows="4">${escHtml(c.text)}</textarea>`;
    case 'quote':
      return `
        <textarea data-field="text" rows="3" placeholder="متن نقل‌قول">${escHtml(c.text)}</textarea>
        <div style="margin-top:8px;">
          <input type="text" data-field="source" placeholder="منبع (مثلاً نام کتاب و نویسنده)" value="${escAttr(c.source)}">
        </div>`;
    case 'image':
      return `
        <input type="url" data-field="url" placeholder="آدرس تصویر (URL)" value="${escAttr(c.url)}" dir="ltr">
        <div style="margin-top:8px;">
          <input type="text" data-field="caption" placeholder="زیرنویس (اختیاری)" value="${escAttr(c.caption)}">
        </div>`;
    case 'divider':
      return `<p style="color:var(--muted); font-size:0.85rem; margin:0;">یک خط جداکننده بین بخش‌ها</p>`;
    default:
      return '';
  }
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}
function escAttr(s) { return escHtml(s).replace(/"/g, '&quot;'); }

function render() {
  const container = document.getElementById('blocks-container');
  container.innerHTML = blocks.map(b => `
    <div class="block-card" data-id="${b._uid}">
      <span class="drag-handle">⠿</span>
      <div class="block-body">
        <div class="block-type-label">
          <span>${BLOCK_LABELS[b.type]}</span>
          <button class="btn-danger" data-remove="${b._uid}" type="button">حذف</button>
        </div>
        ${fieldsHtml(b)}
      </div>
    </div>
  `).join('') || '<p class="empty-note">هنوز بلوکی اضافه نکرده‌ای. از دکمه‌های بالا شروع کن.</p>';

  container.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      blocks = blocks.filter(b => b._uid !== btn.dataset.remove);
      render();
    });
  });

  container.querySelectorAll('.block-card').forEach(card => {
    const block = blocks.find(b => b._uid === card.dataset.id);
    card.querySelectorAll('[data-field]').forEach(input => {
      input.addEventListener('input', () => {
        const field = input.dataset.field;
        block.content[field] = field === 'level' ? parseInt(input.value, 10) : input.value;
      });
    });
  });

  if (window.Sortable && !container._sortableInit) {
    Sortable.create(container, {
      handle: '.drag-handle',
      animation: 150,
      onEnd: () => {
        const order = [...container.querySelectorAll('.block-card')].map(el => el.dataset.id);
        blocks.sort((a, b) => order.indexOf(a._uid) - order.indexOf(b._uid));
      },
    });
    container._sortableInit = true;
  }
}

document.querySelectorAll('[data-add]').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.add;
    blocks.push({ _uid: uid(), type, content: defaultContent(type) });
    render();
  });
});

async function checkAuth() {
  const res = await fetch('/api/session');
  const data = await res.json();
  if (!data.authenticated) location.href = 'index.html';
}

async function loadPage() {
  const res = await fetch(`/api/pages/${pageId}`);
  if (res.status === 401) { location.href = 'index.html'; return; }
  if (!res.ok) { document.getElementById('save-status').textContent = 'صفحه پیدا نشد.'; return; }
  const page = await res.json();

  document.getElementById('title-input').value = page.title;
  document.getElementById('slug-input').value = page.slug;
  document.getElementById('status-input').value = page.status;
  currentSlug = page.slug;
  document.getElementById('preview-link').href = `/page.html?slug=${encodeURIComponent(page.slug)}`;

  blocks = (page.content || []).map(b => ({ _uid: uid(), type: b.type, content: b.content || {} }));
  render();
}

document.getElementById('save-btn').addEventListener('click', async () => {
  const statusEl = document.getElementById('save-status');
  statusEl.textContent = 'در حال ذخیره...';

  const payload = {
    title: document.getElementById('title-input').value.trim() || 'صفحه بدون عنوان',
    slug: document.getElementById('slug-input').value.trim(),
    status: document.getElementById('status-input').value,
    content: blocks.map(({ type, content }) => ({ type, content })),
  };

  try {
    const res = await fetch(`/api/pages/${pageId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (res.ok) {
      currentSlug = data.slug;
      document.getElementById('slug-input').value = data.slug;
      document.getElementById('preview-link').href = `/page.html?slug=${encodeURIComponent(data.slug)}`;
      statusEl.textContent = 'ذخیره شد.';
    } else {
      statusEl.textContent = data.error || 'ذخیره ناموفق بود.';
    }
  } catch (e) {
    statusEl.textContent = 'خطا در ارتباط با سرور.';
  }
  setTimeout(() => { statusEl.textContent = ''; }, 2500);
});

checkAuth();
if (pageId) loadPage();
else document.getElementById('save-status').textContent = 'شناسه صفحه مشخص نیست.';
</script>
</body>
</html>
