<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>در حال بارگذاری... — یادداشت‌های روان‌شناسی</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <p class="site-title"><a href="/">یادداشت‌های روان‌شناسی</a></p>
  </div>
</header>

<main class="wrap">
  <article class="page" id="page-content">
    <p class="empty-state">در حال بارگذاری...</p>
  </article>
</main>

<footer class="site-footer">
  <div class="wrap">© <span id="year"></span></div>
</footer>

<script src="/assets/blocks.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

function formatDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch { return ''; }
}

async function loadPage() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const container = document.getElementById('page-content');

  if (!slug) {
    container.innerHTML = '<p class="empty-state">صفحه‌ای مشخص نشده است.</p>';
    return;
  }

  try {
    const res = await fetch(`/api/public/pages/${encodeURIComponent(slug)}`);
    if (!res.ok) {
      container.innerHTML = '<p class="empty-state">این نوشته پیدا نشد.</p>';
      return;
    }
    const page = await res.json();
    document.title = `${page.title} — یادداشت‌های روان‌شناسی`;

    container.innerHTML = `
      <h1 class="page-title">${escapeHtml(page.title)}</h1>
      <p class="page-date">${formatDate(page.updated_at)}</p>
      ${renderBlocksHTML(page.content)}
      <a class="back-link" href="/">← بازگشت به فهرست نوشته‌ها</a>
    `;
  } catch (e) {
    container.innerHTML = '<p class="empty-state">خطا در بارگذاری این نوشته.</p>';
  }
}

loadPage();
</script>
</body>
</html>
